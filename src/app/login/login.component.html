<div class="login-wrapper">
  <!-- Background gradient blobs -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <div class="login-container">
    <!-- Logo & Branding -->
    <div class="brand-section">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="28" height="28">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l5 2.18V11c0 3.5-2.33 6.79-5 7.93-2.67-1.14-5-4.43-5-7.93V7.18L12 5zm-1 3v4h2V8h-2zm0 6v2h2v-2h-2z"/>
        </svg>
      </div>
      <h1 class="brand-name">VisitorHub</h1>
      <p class="brand-tagline">Secure Entry System</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="card-header">
        <h2 class="card-title">Sign In</h2>
        <p class="card-subtitle">Enter your credentials to access the system</p>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <!-- Unit Select — only for Admin / User -->
        <div class="form-group" [class.has-error]="unitError" *ngIf="showUnitSelect">
          <label class="form-label" for="unit">Unit</label>
          <div class="select-wrapper">
            <select
              id="unit"
              class="form-control form-select"
              [(ngModel)]="selectedUnit"
              name="selectedUnit"
              (focus)="clearError()"
              [disabled]="unitsLoading"
            >
              <option [ngValue]="null" disabled selected>
                {{ unitsLoading ? 'Loading units...' : 'Select a unit' }}
              </option>
              <option *ngFor="let unit of units" [ngValue]="unit.value">
                {{ unit.label ? unit.label : 'Unit ' + unit.value }}
              </option>
            </select>
            <span class="select-arrow">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Username -->
        <div class="form-group" [class.has-error]="usernameError">
          <label class="form-label" for="username">Username</label>
          <input
            id="username"
            type="text"
            class="form-control"
            placeholder="Enter your username"
            [(ngModel)]="username"
            name="username"
            required
            autocomplete="username"
            (focus)="clearError()"
          />
        </div>

        <!-- Password -->
        <div class="form-group" [class.has-error]="passwordError">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              placeholder="Enter your password"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="current-password"
              (focus)="clearError()"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              tabindex="-1"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div class="error-message" *ngIf="errorMessage">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMessage }}
        </div>

        <!-- Sign In Button -->
        <button
          type="submit"
          class="btn-signin"
          [class.loading]="isLoading"
          [disabled]="isLoading"
        >
          <span class="btn-icon" *ngIf="!isLoading">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <span class="btn-spinner" *ngIf="isLoading"></span>
          {{ isLoading ? 'Signing In...' : 'Sign In' }}
        </button>

      </form>

      <!-- Divider -->
      <div class="divider">
        <span>Quick Login (Demo)</span>
      </div>

      <!-- Quick Login Buttons -->
      <div class="quick-login-grid">
        <button
          class="quick-btn"
          *ngFor="let role of demoRoles"
          (click)="quickLogin(role)"
          [class.active]="activeQuickRole === role.label"
          type="button"
        >
          <span class="quick-icon" [style.color]="role.color">
            <ng-container [ngSwitch]="role.icon">
              <svg *ngSwitchCase="'security'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              <svg *ngSwitchCase="'dept'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
              <svg *ngSwitchCase="'admin'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </ng-container>
          </span>
          <span class="quick-label">{{ role.label }}</span>
        </button>
      </div>

      <!-- Demo Credentials -->
      <div class="demo-credentials">
        <p class="demo-title">Demo Credentials:</p>
        <div class="demo-item" *ngFor="let role of demoRoles">
          <span class="demo-role" [style.color]="role.color">{{ role.label }}</span>
          <span class="demo-creds">{{ role.username }} / {{ role.password }}</span>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <p class="footer-text">© 2026 Visitor Pass Management System</p>
  </div>
</div>
