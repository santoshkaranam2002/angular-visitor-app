<aside class="sidenav" [class.open]="open">
  <!-- Brand -->
  <div class="brand">
     <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="28" height="28">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l5 2.18V11c0 3.5-2.33 6.79-5 7.93-2.67-1.14-5-4.43-5-7.93V7.18L12 5zm-1 3v4h2V8h-2zm0 6v2h2v-2h-2z"/>
        </svg>
      </div>
    <div class="brand-text">
      <span class="brand-name">VisitorHub</span>
      <span class="brand-tagline">Secure Entry System</span>
    </div>
    <!-- Mobile close button -->
    <button class="close-btn" (click)="closeRequest.emit()" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="nav">
    <ng-container *ngFor="let item of navItems">
      <div *ngIf="item.section" class="nav-section-label">{{ item.section }}</div>

      <a [routerLink]="item.route"
         routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
         class="nav-item"
         (click)="onNavClick()">
        <!-- Overview -->
        <svg *ngIf="item.icon === 'overview'" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <!-- Visitors -->
        <svg *ngIf="item.icon === 'visitors'" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <!-- Approvals -->
        <svg *ngIf="item.icon === 'approvals'" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
          <polyline points="9 11 12 14 22 4"></polyline>
        </svg>
        <!-- Active Visits -->
        <svg *ngIf="item.icon === 'active'" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
          <line x1="12" y1="14" x2="12" y2="22"></line>
        </svg>
        <!-- History -->
        <svg *ngIf="item.icon === 'history'" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="12 8 12 12 14 14"></polyline>
          <path d="M3.05 11a9 9 0 1 0 .5-4.4L1 11"></path>
          <polyline points="1 7 1 11 5 11"></polyline>
        </svg>
        <!-- Config -->
        <svg *ngIf="item.icon === 'config'" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.07 4.93l-1.41 1.41M5.34 5.34L3.93 6.75M19.07 19.07l-1.41-1.41M5.34 18.66L3.93 17.25M22 12h-2M4 12H2M12 2V0M12 24v-2"></path>
        </svg>

        <!-- Pending Approvals -->
        <svg *ngIf="item.icon === 'approvalss'" class="nav-icon"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="3" width="14" height="18" rx="2"></rect>
          <path d="M9 7h6"></path>
        </svg>

        <!-- Today's Visitors -->
        <svg *ngIf="item.icon === 'calendar'" class="nav-icon"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect>
          <line x1="16" y1="3" x2="16" y2="7"></line>
          <line x1="8" y1="3" x2="8" y2="7"></line>
          <line x1="3" y1="11" x2="21" y2="11"></line>
        </svg>

        <!-- Reports -->
        <svg *ngIf="item.icon === 'reports'" class="nav-icon"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="6" y1="20" x2="6" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="18" y1="20" x2="18" y2="14"></line>
        </svg>

        <!-- Staff Management -->
        <svg *ngIf="item.icon === 'staff'" class="nav-icon"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M17 11l2 2 4-4"></path>
          <path d="M2 21v-2a4 4 0 0 1 4-4h6"></path>
        </svg>

        <span class="nav-label">{{ item.label }}</span>
      </a>
    </ng-container>
  </nav>

  <!-- System Status -->
  <div class="system-status">
    <span class="status-dot"></span>
    <span class="status-text">System Operational</span>
  </div>
</aside>
