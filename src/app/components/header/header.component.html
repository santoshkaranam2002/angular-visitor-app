<header class="header">
  <!-- Left: Hamburger + Title -->
  <div class="header-left">
    <button class="hamburger-btn" (click)="menuToggle.emit()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="title-block">
      <h1 class="page-title">{{ dashboardTitle }}</h1>
      <p class="page-subtitle">Professional service management platform</p>
    </div>
  </div>

  <!-- Right Controls -->
  <div class="header-right">
    <!-- Desktop Search -->

    <!-- Live Data Badge -->
    <div class="live-badge">
      <span class="live-dot"></span>
      <span class="live-text">LIVE DATA</span>
    </div>

    <!-- Notifications -->
    <button class="icon-btn notification-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span *ngIf="hasNotifications" class="notif-dot"></span>
    </button>

    <!-- User Avatar -->
<!-- User Avatar Dropdown -->
<div class="user-menu-wrapper">
  <button class="user-avatar" (click)="toggleUserDropdown()" title="User menu">
    {{ userInitials }}
  </button>
  
  <!-- Dropdown Menu -->
  <div class="user-dropdown" *ngIf="userDropdownOpen()" (click)="$event.stopPropagation()">
    <div class="dropdown-header">
      <div class="dropdown-avatar">{{ userInitials }}</div>
      <div class="dropdown-info">
        <div class="dropdown-name">{{ userName }}</div>
        <div class="dropdown-email">{{ userEmail }}</div>
      </div>
    </div>
    <div class="dropdown-divider"></div>

  </div>
</div>

</header>
